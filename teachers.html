      <div class="profile-section">

      </div>

      <div class="profile-section">

        <div id="profileOpinions"></div>

    </article>
  </div>

  <footer>

    const grid = document.getElementById("teacherGrid");
    const search = document.getElementById("teacherSearch");
    const count = document.getElementById("teacherCount");
    const noResults = document.getElementById("noResults");

    const overlay = document.getElementById("profileOverlay");
    const closeButton = document.getElementById("closeProfile");
    const profilePhoto = document.getElementById("profilePhoto");
    const profileName = document.getElementById("profileName");
    const profileSubject = document.getElementById("profileSubject");
    const profileBio = document.getElementById("profileBio");
    const profileOpinions = document.getElementById("profileOpinions");

    function safe(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderTeachers(list) {
      grid.innerHTML = "";

      list.forEach((teacher) => {
        const index = teachers.indexOf(teacher) + 1;
        const tile = document.createElement("button");
        tile.className = "teacher-tile";
        tile.setAttribute("aria-label", `View ${teacher.name}`);

        const photoMarkup = teacher.photo
          ? `<img src="${safe(teacher.photo)}" alt="${safe(teacher.name)}">`
          : `<div class="tile-photo-placeholder"><span>PHOTO</span></div>`;

        tile.innerHTML = `
          <span class="tile-number">${String(index).padStart(2, "0")}</span>
          <span class="tile-photo">${photoMarkup}</span>
          <span class="tile-caption">
            <strong>${safe(teacher.name)}</strong>
            <small>${safe(teacher.subject)}</small>
          </span>
        `;

        tile.addEventListener("click", () => openProfile(teacher));
        grid.appendChild(tile);
      });

      count.textContent = `${list.length} of ${teachers.length} teachers`;
      noResults.classList.toggle("visible", list.length === 0);
    }

    function openProfile(teacher) {
      profileName.textContent = teacher.name;
      profileSubject.textContent = teacher.subject;
      profileBio.textContent = teacher.bio;

      profilePhoto.innerHTML = teacher.photo
        ? `<img src="${safe(teacher.photo)}" alt="${safe(teacher.name)}">`
        : `<div class="profile-placeholder">PHOTO</div>`;

      profileOpinions.innerHTML = teacher.opinions
        .map(opinion => `<blockquote>“${safe(opinion)}”</blockquote>`)
        .join("");

      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("no-scroll");
      closeButton.focus();
    }

    function closeProfile() {
      overlay.classList.remove("active");
      overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("no-scroll");
    }

    search.addEventListener("input", () => {
      const query = search.value.toLowerCase().trim();

      const filtered = teachers.filter(teacher =>
        teacher.name.toLowerCase().includes(query) ||
        teacher.subject.toLowerCase().includes(query)
      );

      renderTeachers(filtered);
    });

    closeButton.addEventListener("click", closeProfile);

    overlay.addEventListener("click", event => {
      if (event.target === overlay) closeProfile();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && overlay.classList.contains("active")) {
        closeProfile();
      }
    });

    renderTeachers(teachers);
  </script>
